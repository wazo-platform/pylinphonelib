[tox]
env_list = py311, linters
no_package = true

[testenv]
base_python = python3.11
commands =
    pytest --junitxml=unit-tests.xml --cov=linphonelib --cov-report term --cov-report xml:coverage.xml linphonelib {posargs}
deps =
    -rrequirements.txt
    -rtest-requirements.txt
    pytest-cov

[testenv:linters]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files
